# @format

name: Program evaluation interface preflight

on:
  push:
    branches: [fix/dev-program-evaluation-polish-20261124]

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_MODULE: /tmp/procollab-browser-tools/node_modules/playwright-core
      CHROME_PATH: /usr/bin/google-chrome
      REVIEW_OUTPUT: /tmp/program-evaluation-preview
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - name: Test the affected screens and navigation
        run: npx vitest run --maxWorkers=2 app.component.spec.ts analytics.component.spec.ts criteria.component.spec.ts experts.component.spec.ts management.component.spec.ts results.component.spec.ts program-deadlines.spec.ts
      - run: npm install --prefix /tmp/procollab-browser-tools --no-audit --no-fund playwright-core
      - name: Reproduce the previous background seam
        run: |
          set -e
          base=2e97fa654b286e59daa712824a3752a01c4d04d3
          if ! git cat-file -e "${base}^{commit}"; then
            git fetch --no-tags --depth=1 origin "$base"
          fi
          app=projects/social_platform/src/app/app.component.ts
          git show "${base}:${app}" > "$app"
          npm run build:pr
          node docs/responsive/serve.cjs &
          preview=$!
          trap 'kill "$preview"' EXIT
          for attempt in {1..30}; do
            curl --silent --fail http://127.0.0.1:4360/ -o /dev/null && break
            sleep 1
          done
          node .github/program-evaluation-preflight.cjs --baseline
          git restore -- "$app"
      - run: npm run build:pr
      - name: Check program dialogs, navigation and background in Chromium
        run: |
          node docs/responsive/serve.cjs &
          for attempt in {1..30}; do
            curl --silent --fail http://127.0.0.1:4360/ -o /dev/null && break
            sleep 1
          done
          node .github/program-evaluation-preflight.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: program-evaluation-preview
          path: /tmp/program-evaluation-preview
          if-no-files-found: ignore
