name: Role design preflight

on:
  push:
    branches: [fix/dev-role-design-audit-20261121]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Prepare formatting patch
        run: |
          npx prettier --write .github/workflows/role-design-preflight.yml projects/social_platform/src/app/ui/widgets/detail/detail.component.html projects/social_platform/src/app/ui/widgets/detail/detail.component.ts projects/social_platform/src/app/ui/pages/program/management/management.component.html projects/social_platform/src/app/ui/pages/program/management/management.component.ts
          git diff --binary > formatting.patch
      - uses: actions/upload-artifact@v4
        with:
          name: formatting-patch
          path: formatting.patch
      - run: npm run format:check
      - run: npm run lint:ts
      - run: npm run test:ci
      - run: npm run build:pr
