# @format

name: Program notifications preflight

on:
  push:
    branches: [fix/dev-program-snackbars-20261124]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - name: Check affected notification and program flows
        run: npx vitest run --maxWorkers=2 snackbar.component.spec.ts management.component.spec.ts experts.component.spec.ts organizers.component.spec.ts certificates.component.spec.ts criteria.component.spec.ts registration.component.spec.ts project-form.component.spec.ts solution-form.component.spec.ts solution-applications.component.spec.ts results.component.spec.ts analytics.component.spec.ts analytics-attention.component.spec.ts analytics-drilldown.component.spec.ts program-attention-actions.service.spec.ts program-case-projects.service.spec.ts export-file-info.service.spec.ts launch.component.spec.ts
      - id: build
        if: "!cancelled()"
        run: npm run build:pr
      - if: "!cancelled() && steps.build.outcome == 'success'"
        run: npm install --prefix /tmp/procollab-snackbar-tools --no-audit --no-fund playwright-core
      - name: Verify toast above a live Angular modal in Chromium
        if: "!cancelled() && steps.build.outcome == 'success'"
        env:
          PLAYWRIGHT_MODULE: /tmp/procollab-snackbar-tools/node_modules/playwright-core
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          python - <<'PY' &
          import os
          from http.server import SimpleHTTPRequestHandler, ThreadingHTTPServer

          os.chdir("dist/social_platform")

          class App(SimpleHTTPRequestHandler):
              def log_message(self, format, *args):
                  pass

              def do_GET(self):
                  if not os.path.isfile(self.translate_path(self.path)):
                      self.path = "/index.html"
                  super().do_GET()

          ThreadingHTTPServer(("127.0.0.1", 4360), App).serve_forever()
          PY
          for attempt in {1..30}; do
            curl --silent --fail http://127.0.0.1:4360/ -o /dev/null && break
            sleep 1
          done
          mkdir -p /tmp/program-snackbar-preview

          node <<'NODE'
          const assert = require('node:assert/strict');
          const { launch } = require('./docs/responsive/browser-harness.cjs');
          const { program } = require('./docs/responsive/fixtures.cjs');
          const headers = { 'Access-Control-Allow-Origin': '*' };
          const root = '/programs/1/management/';
          const name = 'Кейс-чемпионат «Город будущего»';
          const manager = {
            ...program, name, draft: false, isCompetitive: true, isDistributedEvaluation: true,
            solutionStorageMode: 'legacy_project', programFormat: 'case_championship',
          };
          const workspace = {
            revision: 'v1', requiredEvaluators: 2, managedEvaluation: true, submittedProjects: 0,
            missingAssignments: 0, readyProjects: 0, projects: [], experts: [], cases: [],
          };
          const rating = {
            programId: 1, programName: name, generatedAt: '2026-11-23T21:00:00Z',
            hasNumericCriteria: true, requiredEvaluators: 2, caseOptions: [], criteria: [],
            groups: [{ caseName: null, projects: [
              { id: 3, projectId: 3, name: 'Проект', score: 16, place: 1, ready: true,
                completed: 2, required: 2, caseName: null, averages: {}, experts: [] },
            ] }], maximum: 40,
          };
          async function check(width) {
            const { browser, context, page, base, errors } = await launch(width);
            page.setDefaultTimeout(10000);
            const route = (path, handler) => context.route(url => url.pathname === path, handler);
            const mock = (path, json) => route(path, request => request.fulfill({ json, headers }));
            const button = (label, parent = page) => parent.getByRole('button', { name: label, exact: true });
            const open = section => page.goto(base + '/office/program/1/management/' + section);
            const screenshot = label => page.screenshot({ path: '/tmp/program-snackbar-preview/' + label + '-' + width + '.png' });
            const visibleOverDialog = async (selector, text) => {
              await page.waitForFunction(({ selector, text }) => {
                const item = [...document.querySelectorAll(selector)].find(el => el.textContent.trim() === text);
                if (!item) return false;
                const b = item.getBoundingClientRect();
                const target = document.elementFromPoint(b.left + b.width / 2, b.top + b.height / 2);
                return item.contains(target) && +getComputedStyle(item).opacity > 0.95;
              }, { selector, text }, { timeout: 3500 });
            };
            try {
              await mock('/solution-invitations/', { count: 0, next: null, previous: null, results: [] });
              await mock(root, manager);
              await mock(root + 'experts/', workspace);
              await mock(root + 'results/', rating);
              const methods = [];
              await route(root + 'evaluators/', async route => {
                const request = route.request();
                const payload = request.postDataJSON();
                methods.push(request.method());
                assert.equal(payload.required_evaluators ?? payload.requiredEvaluators, 3);
                if (request.method() === 'POST') {
                  await route.fulfill({ headers, json: {
                    revision: 'reviewed', requiredEvaluators: 3, readyBefore: 0, readyAfter: 0,
                    projectsMissingExperts: 0, missingAssignments: 0, surplusAssignments: 0,
                  } });
                } else {
                  assert.equal(request.method(), 'PUT');
                  assert.equal(payload.revision, 'reviewed');
                  await route.fulfill({ headers, json: { ...workspace, requiredEvaluators: 3, revision: 'v2' } });
                }
              });

              await open('projects?tab=allocation');
              await button('Распределить').click();
              const modal = page.getByRole('dialog', { name: 'Распределить проекты' });
              await button('Увеличить количество экспертов', modal).click();
              await button('Посмотреть изменения', modal).click();
              const save = button('Сохранить и пересчитать', modal);
              await save.waitFor();
              assert.deepEqual(methods, ['POST']);
              assert.equal(await page.locator('app-snackbar .item').count(), 0);
              await save.click();
              const confirmation = 'Готовность проектов пересчитана.';
              const toast = page.locator('app-snackbar .item--success').getByText(confirmation, { exact: true });
              await toast.waitFor();
              await visibleOverDialog('app-snackbar .item--success', confirmation);
              assert.deepEqual(methods, ['POST', 'PUT']);
              assert.equal(await toast.count(), 1);
              assert.equal(await modal.getByText(confirmation, { exact: true }).count(), 0);
              assert.equal(await modal.getByRole('spinbutton').inputValue(), '3');
              if (width !== 320) await screenshot('quota-saved');

              await route(root + 'results/export/', route => route.fulfill({
                headers, status: 503, json: { detail: 'Временная ошибка' },
              }));
              await open('results');
              await button('Выгрузить результаты в Excel').click();
              const exportModal = page.getByRole('dialog', { name: 'Выгрузка результатов' });
              await button('Скачать .xlsx', exportModal).click();
              const error = 'Не удалось подготовить файл. Попробуйте еще раз.';
              await page.locator('app-snackbar .item--error').getByText(error, { exact: true }).waitFor({ timeout: 25000 });
              await visibleOverDialog('app-snackbar .item--error', error);
              assert.equal(await exportModal.getByText(error, { exact: true }).count(), 0);
              assert.equal(await button('Повторить выгрузку', exportModal).isEnabled(), true);
              if (width !== 320) await screenshot('export-error');
              console.log(width + 'px: single global toast above open dialog, saved quota and retry verified');
            } catch (error) {
              console.error({ width, url: page.url(), errors, text: (await page.locator('body').innerText()).slice(0, 1700) });
              await screenshot('failed');
              throw error;
            } finally {
              await browser.close();
            }
          }
          (async () => {
            for (const width of [390, 1440, 320]) await check(width);
          })().catch(error => { console.error(error); process.exitCode = 1; });
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: program-snackbar-preview
          path: /tmp/program-snackbar-preview
