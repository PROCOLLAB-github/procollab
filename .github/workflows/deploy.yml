name: University PROD frontend backup
on:
  push:
    branches: [ops/prod-university-rollout-20261016]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: university-prod-frontend-backup-20261016
  cancel-in-progress: false
jobs:
  backup:
    if: github.ref == 'refs/heads/ops/prod-university-rollout-20261016'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Preserve currently deployed frontend on its host
        env:
          SSH_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          set -Eeuo pipefail
          umask 077
          key="$RUNNER_TEMP/university-frontend-key"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$SSH_KEY" > "$key"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new -i "$key" gh_deploy@app.procollab.ru 'bash -se' < .github/scripts/university-frontend-snapshot.sh
