# @format

name: Program visitor preview

on:
  push:
    branches: [preview/program-visitor-actions-20261123]

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build the reviewed frontend
        run: |
          npm install --prefix /tmp/program-visitor-tools --no-audit --no-fund --no-save playwright-core &
          install_pid=$!
          npm run build:pr
          wait "$install_pid"
      - name: Capture the visitor header from Angular
        env:
          PLAYWRIGHT_MODULE: /tmp/program-visitor-tools/node_modules/playwright-core
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          python - <<'PY' &
          import os
          from http.server import SimpleHTTPRequestHandler, ThreadingHTTPServer

          os.chdir("dist/social_platform")

          class App(SimpleHTTPRequestHandler):
              def do_GET(self):
                  if not os.path.isfile(self.translate_path(self.path)):
                      self.path = "/index.html"
                  super().do_GET()

          ThreadingHTTPServer(("127.0.0.1", 4360), App).serve_forever()
          PY
          for attempt in {1..30}; do
            curl --silent --fail http://127.0.0.1:4360/ -o /dev/null && break
            sleep 1
          done
          mkdir -p /tmp/program-visitor-preview
          node <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const { launch } = require('./docs/responsive/browser-harness.cjs');
          const { program } = require('./docs/responsive/fixtures.cjs');
          const { chromium } = require(process.env.PLAYWRIGHT_MODULE);
          const directory = '/tmp/program-visitor-preview/';
          const landing = 'https://example.org/landing';
          const registration = 'https://example.org/register';
          async function capture(width) {
            const { browser, context, page, base } = await launch(width);
            try {
              let landingUrl = landing;
              await context.route(url => url.pathname === '/programs/1/', route => route.fulfill({
                json: {
                  ...program, name: 'Кейс-чемпионат «Город будущего»', imageAddress: '',
                  isUserMember: false, isUserExpert: false, isUserManager: false,
                  pendingExpertInvitationId: null,
                  datetimeRegistrationEnds: '2099-01-01',
                  datetimeProjectSubmissionEnds: '2099-01-01',
                  registrationLink: registration, landingUrl,
                  courses: [{ id: 10, title: 'Тестовый курс', isAvailable: true }],
                },
                headers: { 'Access-Control-Allow-Origin': '*' }
              }));
              await context.route(url => url.pathname === '/solution-invitations/', route => route.fulfill({
                json: { count: 0, next: null, previous: null, results: [] },
                headers: { 'Access-Control-Allow-Origin': '*' }
              }));
              for (const [key, address] of [['with-landing', landing], ['no-landing', '']]) {
                landingUrl = address;
                await page.goto(base + '/office/program/1');
                const register = page.getByRole('link', { name: 'Зарегистрироваться', exact: true });
                await register.waitFor();
                assert.equal(await register.getAttribute('href'), registration);
                const more = page.getByText('Подробнее', { exact: true }).and(page.locator('.info__program-action'));
                if (address) assert.equal(await more.getAttribute('href'), landing);
                else assert.equal(await more.isDisabled(), true);
                assert.equal(await page.locator('.info__actions--program > .info__program-action').count(), 2);
                assert.equal(await page.getByText('Курсы программы', { exact: true }).count(), 0);
                const cover = await page.locator('.info__cover--program').boundingBox();
                const heading = await page.getByRole('heading', { name: 'Кейс-чемпионат «Город будущего»' }).boundingBox();
                const action = await more.boundingBox();
                const registrationAction = await register.boundingBox();
                assert.ok(Math.abs(action.width - registrationAction.width) < 1);
                assert.ok(Math.abs(action.y - registrationAction.y) < 1);
                const bottom = Math.max(action.y + action.height, heading.y + heading.height);
                const x = Math.max(0, cover.x - 12);
                await page.evaluate(() => document.fonts.ready);
                await page.waitForFunction(() => {
                  const avatar = document.querySelector('.info__avatar--program img');
                  return avatar?.complete && avatar.naturalWidth > 0;
                });
                await page.screenshot({
                  path: directory + width + '-' + key + '.png',
                  clip: { x, y: cover.y, width: Math.min(width - x, cover.width + 24), height: bottom - cover.y + 16 }
                });
                console.log(width + 'px ' + key + ': correct link state, no course');
              }
            } finally {
              await browser.close();
            }
          }
          async function pair() {
            const browser = await chromium.launch({ executablePath: process.env.CHROME_PATH });
            try {
              for (const width of [1440, 390]) {
                const page = await browser.newPage({ viewport: { width: 1000, height: 900 } });
                const figure = (key, caption) => {
                  const image = fs.readFileSync(directory + width + '-' + key + '.png').toString('base64');
                  return '<figure><figcaption>' + caption + '</figcaption><img alt="" src="data:image/png;base64,' + image + '"></figure>';
                };
                const style = '<style>body{margin:0;background:#fff;font:16px system-ui;color:#282531}main{display:flex;gap:16px;width:max-content;padding:4px 0}figure{margin:0}figcaption{margin:4px 0 8px;font-weight:600}img{display:block}main.desktop{flex-direction:column}</style>';
                await page.setContent(style + '<main class="' + (width === 1440 ? 'desktop' : '') + '">' + figure('with-landing', 'Лендинг указан') + figure('no-landing', 'Адрес не задан') + '</main>');
                await page.locator('main').screenshot({ path: directory + 'visitor-' + (width === 1440 ? 'desktop' : 'mobile') + '.png' });
                await page.close();
              }
            } finally {
              await browser.close();
            }
          }
          (async () => {
            for (const width of [1440, 390]) await capture(width);
            await pair();
          })().catch(error => { console.error(error); process.exitCode = 1; });
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: program-visitor-preview
          path: /tmp/program-visitor-preview
