# @format

name: Deploy to dev-stage

on:
  push:
    branches: [dev, feature/dev-analytics-case-drilldown-angular]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 79417c0e1251a9e91a268da55c3b69ea7f49dc79
      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint:ts
      - run: npm run test:ci
      - run: npm run build:pr
      - name: Deploy to dev-stage
        if: github.ref == 'refs/heads/dev'
        uses: burnett01/rsync-deployments@5.2.1
        with:
          switches: -avzr --delete
          path: dist/social_platform/
          remote_path: /home/front/app
          remote_user: front
          remote_key: ${{ secrets.DEPLOY_KEY_FRONT_DEV }}
          remote_host: dev.procollab.ru
