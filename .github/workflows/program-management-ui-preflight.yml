# @format

name: Program management UI preflight

on:
  push:
    branches: [fix/dev-program-management-ui-20261124]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - name: Check changed program scenarios
        run: npx vitest run --maxWorkers=2 management.component.spec.ts criteria.component.spec.ts experts.component.spec.ts expert-roster.component.spec.ts solution-applications.component.spec.ts results.component.spec.ts certificates.component.spec.ts
      - id: build
        if: "!cancelled()"
        run: npm run build:pr
      - if: "!cancelled() && steps.build.outcome == 'success'"
        run: npm install --prefix /tmp/program-management-tools --no-audit --no-fund playwright-core
      - name: Verify rendered management screens in Chromium
        if: "!cancelled() && steps.build.outcome == 'success'"
        env:
          PLAYWRIGHT_MODULE: /tmp/program-management-tools/node_modules/playwright-core
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          python - <<'PY' &
          import os
          from http.server import SimpleHTTPRequestHandler, ThreadingHTTPServer

          os.chdir("dist/social_platform")

          class App(SimpleHTTPRequestHandler):
              def log_message(self, format, *args):
                  pass

              def do_GET(self):
                  if not os.path.isfile(self.translate_path(self.path)):
                      self.path = "/index.html"
                  super().do_GET()

          ThreadingHTTPServer(("127.0.0.1", 4360), App).serve_forever()
          PY
          for attempt in {1..30}; do
            curl --silent --fail http://127.0.0.1:4360/ -o /dev/null && break
            sleep 1
          done
          mkdir -p /tmp/program-management-preview
          node <<'NODE'
          const assert = require('node:assert/strict');
          const { launch } = require('./docs/responsive/browser-harness.cjs');
          const { program } = require('./docs/responsive/fixtures.cjs');
          const empty = { count: 0, totalCount: 0, next: null, previous: null, results: [] };
          const fixture = {
            ...program, name: 'Кейс-чемпионат «Город будущего»', draft: true, isCompetitive: true,
            isDistributedEvaluation: true, programFormat: 'case_championship', solutionStorageMode: 'legacy_project',
            datetimeRegistrationEnds: '2099-10-01', datetimeFinished: '2099-12-01',
          };
          const criteria = {
            updatedAt: '2026-11-22T12:00:00Z', revision: 'v1', locked: false, supportedTypes: ['int', 'bool', 'str'],
            criteria: [
              { id: 1, name: 'Реализуемость', description: 'Насколько проработано решение', type: 'int', minValue: 0, maxValue: 10 },
              { id: 2, name: 'Комментарий', type: 'str', minValue: null, maxValue: null },
            ],
          };
          const screens = [
            { section: 'participants', label: 'Участники · 0', emptyText: 'В программе пока нет участников', exportName: 'Выгрузить участников в Excel' },
            { section: 'projects', label: 'Проекты · 0', emptyText: 'В программе пока нет проектов', exportName: 'Выгрузить проекты в Excel' },
            { section: 'experts', label: 'Эксперты · 0', emptyText: 'Экспертов пока нет', exportName: 'Выгрузить экспертов в Excel' },
          ];
          async function check(width) {
            const { browser, context, page, base, errors, requests } = await launch(width);
            page.setDefaultTimeout(10000);
            const managementPath = '/programs/1/management/';
            const payloads = {
              '/solution-invitations/': empty,
              [managementPath]: fixture,
              [managementPath + 'participants/']: { ...empty, regionOptions: [] },
              [managementPath + 'projects/']: { ...empty, caseOptions: [], isCompetitive: true },
              [managementPath + 'criteria/']: criteria,
              [managementPath + 'experts/']: {
                experts: [], revision: 'v1', requiredEvaluators: 2, managedEvaluation: true,
                submittedProjects: 0, missingAssignments: 0, readyProjects: 0,
              },
            };
            for (const [pathname, json] of Object.entries(payloads)) {
              await context.route(url => url.pathname === pathname, route => route.fulfill({
                json, headers: { 'Access-Control-Allow-Origin': '*' },
              }));
            }
            const open = section => page.goto(base + '/office/program/1/management/' + section);
            async function capture(name) {
              await page.evaluate(() => document.fonts.ready);
              const pageWidth = await page.evaluate(() => document.documentElement.scrollWidth);
              assert.ok(pageWidth <= width + 1, name + ' exceeds viewport: ' + pageWidth);
              if (width !== 320) await page.screenshot({ path: '/tmp/program-management-preview/' + name + '-' + width + '.png' });
            }
            try {
              for (const { section, label, emptyText, exportName } of screens) {
                await open(section);
                const heading = page.getByRole('heading', { name: label, exact: true });
                await heading.waitFor();
                await page.getByText(emptyText, { exact: true }).waitFor();
                const icon = page.locator('app-state use');
                await icon.waitFor({ state: 'attached' });
                const symbol = await icon.evaluate(use => use.href.baseVal);
                assert.match(symbol, /#empty-chat$/);
                const download = page.getByRole('button', { name: exportName, exact: true });
                const style = await download.evaluate(button => {
                  const css = getComputedStyle(button);
                  return [css.width, css.height, css.borderTopWidth, css.borderRadius, button.querySelector('svg').getAttribute('width')];
                });
                const size = width < 1000 ? '44px' : '32px';
                assert.deepEqual(style, [size, size, '1px', '8px', '18']);
                if (section === 'participants') {
                  assert.equal(await page.locator('.management__list-heading').getByRole('link', { name: 'Сертификаты' }).count(), 1);
                }
                assert.equal(await page.locator('main.management thead:visible').count(), 0);
                await capture(section);
              }
              await open('settings?tab=criteria');
              const header = page.locator('.section-header__heading').filter({ hasText: 'Критерии оценки' });
              const preview = header.getByRole('button', { name: 'Предпросмотр формы' });
              await preview.waitFor();
              assert.equal(await page.getByText('Один набор для всех кейсов программы.', { exact: true }).count(), 0);
              assert.equal(await page.getByRole('heading', { name: 'Критерии программы' }).count(), 0);
              assert.equal(await page.getByText('После первой сохраненной оценки весь набор критериев будет зафиксирован.', { exact: true }).count(), 0);
              await page.getByText('Настройте форму до первой сохраненной оценки.', { exact: true }).waitFor();
              assert.equal(await page.getByRole('button', { name: 'Добавить критерий' }).getAttribute('appButton'), 'primary');
              await capture('criteria');
              await preview.click();
              await page.getByRole('heading', { name: 'Предпросмотр формы оценивания' }).waitFor();
              const spacing = await page.locator('.criteria__preview-note').evaluate(note => {
                const header = note.previousElementSibling.getBoundingClientRect();
                return note.getBoundingClientRect().top - header.bottom;
              });
              assert.ok(spacing >= 4 && spacing <= 16, 'Preview header gap is ' + spacing);
              await capture('criteria-preview');
              console.log(width + 'px: list headings, export buttons, coffee states and criteria preview verified');
            } catch (error) {
              console.error({ width, url: page.url(), requests: requests.slice(-12), errors, text: (await page.locator('body').innerText()).slice(0, 1500) });
              await page.screenshot({ path: '/tmp/program-management-preview/failed-' + width + '.png' });
              throw error;
            } finally {
              await browser.close();
            }
          }
          (async () => {
            for (const width of [390, 1440, 320]) await check(width);
          })().catch(error => { console.error(error); process.exitCode = 1; });
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: program-management-preview
          path: /tmp/program-management-preview
