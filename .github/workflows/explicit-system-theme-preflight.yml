# @format

name: Explicit system theme preflight

on:
  push:
    branches: [fix/dev-explicit-system-theme-20261125]

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_MODULE: /tmp/procollab-browser-tools/node_modules/playwright-core
      CHROME_PATH: /usr/bin/google-chrome
      REVIEW_OUTPUT: /tmp/certificate-journal-search-preview
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npx vitest run --maxWorkers=2 profile-info.component.spec.ts
      - run: npm run build:pr
      - run: npm install --prefix /tmp/procollab-browser-tools --no-audit --no-fund playwright-core
      - name: Verify theme selection in Chromium
        run: |
          node docs/responsive/serve.cjs &
          for attempt in {1..30}; do
            curl --silent --fail http://127.0.0.1:4360/ -o /dev/null && break
            sleep 1
          done
          node .github/explicit-system-theme-preflight.cjs
