# @format

name: Program screens preflight

on:
  push:
    branches: [fix/dev-program-review-20261124]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - name: Check affected program scenarios
        run: npx vitest run --maxWorkers=2 main.roles.spec.ts detail-cleanup.component.spec.ts detail-program-info.service.spec.ts experts.component.spec.ts solution-allocation.component.spec.ts results.component.spec.ts criteria.component.spec.ts section-header.component.spec.ts
      - id: build
        if: "!cancelled()"
        run: npm run build:pr
      - if: "!cancelled() && steps.build.outcome == 'success'"
        run: npm install --prefix /tmp/procollab-program-review-tools --no-audit --no-fund playwright-core
      - name: Verify the actual screens in Chromium
        if: "!cancelled() && steps.build.outcome == 'success'"
        env:
          PLAYWRIGHT_MODULE: /tmp/procollab-program-review-tools/node_modules/playwright-core
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          python - <<'PY' &
          import os
          from http.server import SimpleHTTPRequestHandler, ThreadingHTTPServer

          os.chdir("dist/social_platform")

          class App(SimpleHTTPRequestHandler):
              def log_message(self, format, *args):
                  pass

              def do_GET(self):
                  if not os.path.isfile(self.translate_path(self.path)):
                      self.path = "/index.html"
                  super().do_GET()

          ThreadingHTTPServer(("127.0.0.1", 4360), App).serve_forever()
          PY
          for attempt in {1..30}; do
            curl --silent --fail http://127.0.0.1:4360/ -o /dev/null && break
            sleep 1
          done
          mkdir -p /tmp/procollab-program-review-preview
          node <<'NODE'
          const assert = require('node:assert/strict');
          const { launch } = require('./docs/responsive/browser-harness.cjs');
          const { program } = require('./docs/responsive/fixtures.cjs');
          const response = { 'Access-Control-Allow-Origin': '*' };
          const root = '/programs/1/management/';
          const name = 'Кейс-чемпионат «Город будущего»';
          const empty = { count: 0, next: null, previous: null, results: [] };
          const workspace = {
            revision: 'v1', requiredEvaluators: 2, managedEvaluation: true,
            submittedProjects: 0, missingAssignments: 0, readyProjects: 0, cases: [], projects: [],
            experts: [
              { id: 2, userId: 11, name: 'Анна Иванова', email: 'expert@example.org',
                status: 'joined', allCases: true, assigned: 0, completed: 0, remaining: 0 },
            ],
          };
          const results = {
            programId: 1, programName: name, generatedAt: '2026-11-23T21:00:00Z',
            hasNumericCriteria: true, requiredEvaluators: 2, caseOptions: [], criteria: [],
            groups: [], maximum: 40,
          };
          const manager = {
            ...program, name, isCompetitive: true, isDistributedEvaluation: true, draft: false,
            programFormat: 'case_championship', solutionStorageMode: 'legacy_project',
          };
          const visitor = {
            ...program, name, isUserManager: false, isUserExpert: false, isUserMember: false,
            description: undefined, shortDescription: undefined, links: [], materials: [],
            advertisementImageAddress: '', landingUrl: 'https://example.org/program',
            registrationLink: 'https://example.org/register', datetimeRegistrationEnds: '2099-01-01T00:00:00Z',
          };
          const promo = '/assets/images/office/shared/backgorund-image-rocket-main.svg';
          const timeout = { timeout: 10000 };
          const saveScreen = (page, width, name) =>
            page.screenshot({ path: '/tmp/procollab-program-review-preview/' + name + '-' + width + '.png' });
          async function check(width) {
            const { browser, context, page, base, errors } = await launch(width);
            page.setDefaultTimeout(8500);
            const userProgram = '/office/program/1';
            const management = userProgram + '/management';
            let detail = { ...visitor };
            const mock = (pathname, data) =>
              context.route(url => url.pathname === pathname, route => route.fulfill({
                json: typeof data === 'function' ? data() : data, headers: response,
              }));
            await mock('/solution-invitations/', empty);
            await mock('/programs/1/', () => detail);
            await mock(root, manager);
            await mock(root + 'experts/', workspace);
            await mock(root + 'results/', results);
            const button = label => page.getByRole('button', { name: label, exact: true });
            const dialog = label => page.getByRole('dialog', { name: label, exact: true });
            const open = section => page.goto(base + management + '/' + section);
            const assertFit = async () => {
              const actual = await page.evaluate(() => document.documentElement.scrollWidth);
              assert.ok(actual <= width + 1, 'Page too wide: ' + actual);
            };
            const capture = async name => {
              await assertFit();
              if (width !== 320) {
                await page.evaluate(() => document.fonts.ready);
                await saveScreen(page, width, name);
              }
            };
            try {
              await page.goto(base + userProgram);
              const registerLink = page.getByRole('link', { name: 'Зарегистрироваться', exact: true });
              await registerLink.waitFor(timeout);
              assert.equal(await registerLink.getAttribute('href'), visitor.registrationLink);
              assert.equal(await page.locator('.program__about').count(), 0);
              const more = page.getByRole('link', { name: 'Подробнее', exact: true });
              assert.equal(await more.getAttribute('href'), visitor.landingUrl);
              detail = { ...visitor, datetimeRegistrationEnds: '2000-01-01T00:00:00Z', advertisementImageAddress: promo };
              await page.reload();
              await button('Зарегистрироваться').waitFor(timeout);
              assert.equal(await button('Зарегистрироваться').isDisabled(), true);
              assert.equal(await page.locator('.program__about').count(), 0);
              await page.locator('.program__advertisement img').waitFor(timeout);
              await capture('registration-closed');

              await open('experts');
              const expertHeader = page.locator('.section-header__heading').filter({ hasText: 'Эксперты · 1' });
              await expertHeader.waitFor(timeout);
              const invite = expertHeader.getByRole('button', { name: 'Пригласить эксперта', exact: true });
              const exportExperts = expertHeader.getByRole('button', { name: 'Выгрузить экспертов в Excel', exact: true });
              await exportExperts.waitFor(timeout);
              const [headingBox, inviteBox, exportBox] = await Promise.all([
                expertHeader.getByRole('heading').boundingBox(), invite.boundingBox(), exportExperts.boundingBox(),
              ]);
              assert.ok(inviteBox.x < exportBox.x && Math.abs(inviteBox.y - exportBox.y) < 1);
              if (width >= 390) assert.ok(Math.abs(headingBox.y + headingBox.height / 2 - (inviteBox.y + inviteBox.height / 2)) < 2);
              await capture('experts');

              await open('projects?tab=allocation');
              const distribution = page.locator('.section-header__heading').filter({ hasText: 'Распределение экспертов' });
              await distribution.getByRole('button', { name: 'Распределить', exact: true }).click(timeout);
              const options = dialog('Распределить проекты');
              await options.waitFor(timeout);
              const quota = options.getByRole('spinbutton', { name: /Экспертов на проект/i });
              assert.equal(await quota.inputValue(), '2');
              assert.equal(await options.getByRole('heading', { name: 'Вручную', exact: true }).count(), 1);
              assert.equal(await options.getByRole('heading', { name: 'Автоматически', exact: true }).count(), 1);
              await options.getByRole('button', { name: 'Увеличить количество экспертов', exact: true }).click(timeout);
              assert.equal(await quota.inputValue(), '3');
              await options.getByRole('button', { name: 'Посмотреть изменения', exact: true }).waitFor(timeout);
              await capture('distribution');
              await page.keyboard.press('Escape');
              await options.waitFor({ state: 'hidden', timeout: 8500 });
              await distribution.getByRole('button', { name: 'Распределить', exact: true }).click(timeout);
              await options.waitFor(timeout);
              assert.equal(await quota.inputValue(), '2', 'Closing without saving must preserve the quota');

              await open('results');
              const ranking = page.locator('.section-header__heading').filter({ hasText: 'Рейтинг проектов' });
              await ranking.getByRole('button', { name: 'Обновить результаты', exact: true }).waitFor(timeout);
              await ranking.getByRole('button', { name: 'Выгрузить результаты в Excel', exact: true }).waitFor(timeout);
              const explanation = ranking.locator('.section-header__title').getByRole('button', { name: 'Как считается балл', exact: true });
              await explanation.waitFor(timeout);
              await capture('ranking');
              await explanation.click(timeout);
              await dialog('Как считается балл').waitFor(timeout);
              console.log(width + 'px: visitor, experts, allocation and ranking passed');
            } catch (error) {
              console.error({ width, url: page.url(), errors, text: (await page.locator('body').innerText()).slice(0, 1950) });
              await saveScreen(page, width, 'failed');
              throw error;
            } finally {
              await browser.close();
            }
          }
          (async () => {
            for (const width of [390, 1440, 320]) await check(width);
          })().catch(error => { console.error(error); process.exitCode = 1; });
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: program-screens-preview
          path: /tmp/procollab-program-review-preview
