<!-- @format -->

<mat-progress-bar
  [style.display]="(isLoading$ | async) ? 'block' : 'none'"
  class="loader"
  mode="query"
>
</mat-progress-bar>
@if (instance.error(); as error) {
  <main class="instance-error">
    <h1>Пилот кейс-чемпионата</h1>
    <p appAlert="error" role="alert">{{ error }}</p>
    <button appButton="primary" type="button" (click)="reload()">Повторить</button>
  </main>
} @else {
  <router-outlet></router-outlet>
  <app-cookie-consent></app-cookie-consent>
}
