<!-- @format -->
<!-- Desktop сохраняет production-разметку; адаптив ниже 1000px. -->
@if (releaseDesktop()) {
  <div class="field" [class.field--checked]="checked()" (click)="checked.set(!checked())">
    <i
      appIcon
      icon="check"
      [appWidth]="size() ?? '12'"
      [appHeight]="size() ?? '10'"
      class="field__check"
    ></i>
  </div>
} @else {
  <button
    type="button"
    class="field"
    role="checkbox"
    [attr.aria-label]="label()"
    [attr.aria-checked]="checked()"
    [disabled]="disabled()"
    [class.field--checked]="checked()"
    (click)="toggle()"
  >
    <i
      appIcon
      icon="check"
      [appWidth]="size() ?? '12'"
      [appHeight]="size() ?? '10'"
      class="field__check"
      aria-hidden="true"
    ></i>
  </button>
}
