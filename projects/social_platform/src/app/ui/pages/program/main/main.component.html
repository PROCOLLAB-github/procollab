<!-- @format -->

<div class="programs">
  <div class="programs__filters">
    <button
      appButton="secondary"
      type="button"
      class="programs__filter-toggle"
      aria-controls="program-catalog-filters"
      [attr.aria-expanded]="filtersOpen()"
      (click)="filtersOpen.set(!filtersOpen())"
    >
      {{ isPparticipating() ? "Фильтры (1)" : "Фильтры" }}
    </button>

    <div
      appCard
      id="program-catalog-filters"
      class="programs__filter"
      [class.programs__filter--open]="filtersOpen()"
    >
      <p class="text-body-14 programs__filter-title">фильтры</p>

      <label class="programs__filter--block">
        <app-checkbox
          labelledBy="program-participation-filter"
          [checked]="isPparticipating()"
          (checkedChange)="onTogglePparticipating()"
        />
        <span id="program-participation-filter" class="text-body-12 programs__filter--text">
          участвую
        </span>
      </label>

      <app-select
        class="programs__filter-select"
        size="big"
        placeholder="все"
        [options]="programOptionsFilter"
        [isDisabled]="true"
      ></app-select>
    </div>
  </div>

  @if (programs()) {
    <div class="programs__list">
      @for (p of programs(); track p.id) {
        <a [routerLink]="AppRoutes.program.detail(p.id)">
          <app-program-card [program]="p"></app-program-card>
        </a>
      }
    </div>
  }
</div>
