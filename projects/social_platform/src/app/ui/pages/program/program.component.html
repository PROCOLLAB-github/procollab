<!-- @format -->

<main class="page">
  <div class="page__bar">
    <app-page-header title="программы" backRoute="/office/feed">
      @if (canCreate()) {
        <a appButton="primary" class="program-create-action" [routerLink]="paths.program.create()"
          ><i appIcon icon="plus" appSquare="12"></i>Создать программу</a
        >
      } @else if (canCreate() === false) {
        <details class="program-creation-help">
          <summary class="program-creation-help__trigger">
            <i appIcon icon="hint" appSquare="16" aria-hidden="true"></i>
            Как создать программу?
          </summary>
          <div class="program-creation-help__content">
            <p>
              Чтобы получить доступ к созданию программы, обратитесь к администратору платформы.
            </p>
            <div class="program-creation-help__contacts">
              <a href="https://t.me/evsfed">Telegram: @evsfed</a>
              <a href="mailto:partners@procollab.ru">partners@procollab.ru</a>
            </div>
          </div>
        </details>
      }
    </app-page-header>
  </div>

  <app-tabs
    class="program-navigation"
    label="Программы"
    appearance="underline"
    [items]="programTabs"
  />
  @if (!isManaged()) {
    <form appFormLayout class="page__search" [formGroup]="searchForm">
      <app-search
        formControlName="search"
        [openable]="false"
        appearance="inline"
        placeholder="Поиск"
        ariaLabel="Поиск по названию программы"
      />
    </form>
  }
  <router-outlet></router-outlet>
</main>
