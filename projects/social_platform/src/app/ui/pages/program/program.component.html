<!-- @format -->

<main class="page">
  <div class="page__bar">
    <app-page-header title="программы" backRoute="/office/feed" />
  </div>

  <app-tabs
    class="program-navigation"
    label="Программы"
    appearance="underline"
    [items]="programTabs"
  />
  @if (!isManaged()) {
    <app-program-catalog-toolbar>
      <form appFormLayout [formGroup]="searchForm">
        <app-search
          formControlName="search"
          [openable]="false"
          appearance="inline"
          placeholder="Поиск"
          ariaLabel="Поиск по названию программы"
        />
      </form>
    </app-program-catalog-toolbar>
  }
  <router-outlet></router-outlet>
</main>
