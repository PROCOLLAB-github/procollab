<!-- @format -->

<main class="page">
  <div class="page__bar">
    <div class="program-heading">
      <app-page-header title="программы" backRoute="/office/feed" />
      @if (canCreate()) {
        <a appButton="primary" [routerLink]="paths.program.create()"
          ><i appIcon icon="plus" appSquare="12"></i>Создать программу</a
        >
      }
    </div>
  </div>

  <app-tabs
    class="program-navigation"
    label="Программы"
    appearance="underline"
    [items]="programTabs"
  />
  @if (!isManaged()) {
    <form appFormLayout class="page__search" [formGroup]="searchForm">
      <app-search
        formControlName="search"
        [openable]="false"
        appearance="inline"
        placeholder="Поиск"
        ariaLabel="Поиск по названию программы"
      />
    </form>
  }
  <router-outlet></router-outlet>
</main>
