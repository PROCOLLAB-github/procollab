<!-- @format -->

<main class="page">
  <div class="page__bar">
    <app-page-header title="программы" backRoute="/office/feed" />
  </div>

  @if (!isManaged()) {
    <app-program-catalog-toolbar>
      <form appFormLayout [formGroup]="searchForm">
        <app-search
          formControlName="search"
          [openable]="false"
          appearance="outlined"
          placeholder="Поиск по названию"
          ariaLabel="Поиск по названию программы"
        />
      </form>
    </app-program-catalog-toolbar>
  }
  <router-outlet></router-outlet>
</main>
