<!-- @format -->

<div class="field" [class.field--error]="error()">
  <input
    appField
    type="number"
    placeholder="Введите баллы"
    [value]="value"
    [attr.aria-label]="label()"
    [min]="min()"
    [max]="max()"
    [step]="step()"
    [disabled]="disabled"
    (input)="onInput($event)"
    (keydown)="onKeydown($event)"
    (blur)="onBlur()"
    (paste)="onPaste($event)"
    class="field__input text-body-10"
    [class.field__input--error]="error()"
  />
</div>
