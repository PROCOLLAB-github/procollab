<!-- @format -->

<div class="field" [class.field--compact]="compact()" [class.field--error]="error()">
  <input
    appField
    type="number"
    [placeholder]="compact() ? '—' : 'Введите баллы'"
    [value]="value"
    [attr.aria-label]="label()"
    [title]="
      (min() === null ? 'Без минимума' : 'От ' + min()) +
      (max() === null ? ', без максимума' : ' до ' + max())
    "
    [min]="min()"
    [max]="max()"
    [step]="step()"
    [disabled]="disabled"
    (input)="onInput($event)"
    (keydown)="onKeydown($event)"
    (blur)="onBlur()"
    (paste)="onPaste($event)"
    class="field__input text-body-10"
    [class.field__input--error]="error()"
  />
  @if (compact()) {
    <span class="field__scale" aria-hidden="true">
      @if (max() !== null) {
        {{ min() !== null && min() !== 0 ? min() + "–" : "/ " }}{{ max() }}
      } @else if (min() !== null) {
        ≥ {{ min() }}
      }
    </span>
  }
</div>
