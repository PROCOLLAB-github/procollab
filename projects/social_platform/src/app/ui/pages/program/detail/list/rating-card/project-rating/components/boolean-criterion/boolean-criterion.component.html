<!-- @format -->
<!-- Desktop сохраняет production-разметку; адаптив ниже 1000px. -->
@if (releaseDesktop()) {
  <label class="container">
    <input
      type="checkbox"
      [checked]="isChecked"
      (change)="onChanged($event)"
      [disabled]="disabled"
    />
    <div class="checkbox" [class.checkbox__checked]="isChecked">
      <i appIcon icon="check" appSquare="14" (click)="onClickLog()"></i>
    </div>
  </label>
} @else {
  <label class="container">
    <input
      appChoice
      type="checkbox"
      [checked]="isChecked"
      (change)="onChanged($event)"
      [disabled]="disabled"
    />
    <div class="checkbox" [class.checkbox__checked]="isChecked">
      <i appIcon icon="check" appSquare="14" (click)="onClickLog()"></i>
    </div>
  </label>
}
