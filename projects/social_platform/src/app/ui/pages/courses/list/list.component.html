<!-- @format -->

<div class="courses">
  @if (loading()) {
    <app-state kind="loading" />
  } @else if (coursesList().length) {
    <div class="courses__list">
      @for (course of coursesList(); track course.id) {
        <a [routerLink]="AppRoutes.courses.detail(course.id)">
          <app-course [course]="course"></app-course>
        </a>
      }
    </div>
  } @else {
    <app-state title="Ничего не найдено" />
  }
</div>
