<!-- @format -->

@if (desktopLayout()) {
  <nav class="project__navigation">
    <ul class="project__nav">
      @for (item of navItems(); track $index) {
        <li>
          <button
            type="button"
            class="project__item"
            [attr.aria-current]="currentStep() === item.step ? 'step' : null"
            [class.project__item--active]="currentStep() === item.step"
            (click)="onStepClick(item.step)"
          >
            <i
              appIcon
              [icon]="item.src"
              class="project__icon"
              appSquare="14"
              [class.project__icon--active]="currentStep() === item.step"
              aria-hidden="true"
            ></i>
            <span
              class="project__subtitle"
              [class.project__subtitle--active]="currentStep() === item.step"
            >
              {{ item.label }}
            </span>
          </button>
        </li>
      }
    </ul>
  </nav>
} @else {
  <app-tabs
    label="Шаги редактирования"
    [items]="tabs()"
    [active]="currentStep()"
    (selected)="onTabSelected($event)"
  />
}
