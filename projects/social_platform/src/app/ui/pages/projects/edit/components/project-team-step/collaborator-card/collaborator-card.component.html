<!-- @format -->
<article class="member-row">
  <app-avatar [url]="collaborator().avatar" [size]="44" />
  <div class="member-row__identity">
    <h4 class="member-row__name">
      {{ collaborator().firstName }} {{ collaborator().lastName }}
      @if (isCurrentUser()) {
        <span class="member-row__you">Вы</span>
      }
    </h4>
    <p class="member-row__description">
      {{ isLeader() ? "Руководитель проекта" : "Участник проекта" }}
    </p>
    <span class="member-row__role">{{ collaborator().role || "Роль не указана" }}</span>
  </div>
  <span class="member-row__status">В команде</span>
  <div class="member-row__actions">
    <button
      type="button"
      class="member-row__action member-row__action--danger"
      [attr.aria-label]="
        'Исключить участника: ' + collaborator().firstName + ' ' + collaborator().lastName
      "
      title="Исключить участника"
      [disabled]="removing()"
      [attr.aria-busy]="removing()"
      (click)="onDeleteCollaborator(collaborator().userId)"
    >
      <i appIcon icon="basket" appSquare="18" aria-hidden="true"></i>
    </button>
  </div>
  @if (error()) {
    <p class="member-row__error" role="alert">{{ error() }}</p>
  }
</article>
