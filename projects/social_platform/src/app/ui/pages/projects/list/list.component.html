<!-- @format -->

<section class="page">
  @if (isAll()) {
    <button
      type="button"
      class="filter-toggle page__filter-toggle"
      [attr.aria-expanded]="isFilterOpen()"
      aria-controls="project-filters"
      (click)="isFilterOpen.set(!isFilterOpen())"
    >
      <span>Фильтр</span>
      <i appIcon icon="filter" appSquare="34"></i>
    </button>
  }
  <ul class="page__list" #listRoot>
    @for (project of projects(); track isInvites() ? project.inviteId : project.id) {
      <li>
        @if (!isInvites()) {
          <ng-container *ngTemplateOutlet="projectCard"></ng-container>
        } @else {
          <a [routerLink]="AppRoutes.projects.detail(project.id)">
            <ng-container *ngTemplateOutlet="projectCard"></ng-container>
          </a>
        }
        <ng-template #projectCard>
          <app-info-card
            [info]="project"
            [type]="isInvites() ? 'invite' : 'projects'"
            [appereance]="isMy() ? 'my' : isSubs() ? 'subs' : 'base'"
            [showSubscriptionAction]="isSubs() || isAll()"
            [isSubscribed]="profileProjSubsIds()!.includes(project.id)"
            [profileId]="project.id"
            [loggedUserId]="profile()?.id"
            (onAcceptingInvite)="onAcceptInvite($event)"
            (onRejectingInvite)="onRejectInvite($event)"
          ></app-info-card>
        </ng-template>
      </li>
    } @empty {
      <li class="page__empty">
        @if (hasSearch()) {
          <app-state
            title="Ничего не найдено"
            description="Попробуйте изменить поисковый запрос."
          />
        } @else if (isSubs()) {
          <app-state
            title="Нет подписок на проекты"
            description="Подпишитесь на интересный проект в общем списке, чтобы он появился здесь."
          >
            <a [routerLink]="AppRoutes.projects.all()">Найти проект</a>
          </app-state>
        } @else if (isInvites()) {
          <app-state
            title="Нет приглашений в проекты"
            description="Когда команда пригласит вас в проект, приглашение появится здесь."
          />
        } @else {
          <app-state title="Ничего не найдено" />
        }
      </li>
    }
  </ul>
</section>
