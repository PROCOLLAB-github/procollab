<!-- @format -->

<div class="dashboard__block">
  <div class="dashboard__top">
    <p class="text-body-12">{{ title() }}</p>
    <i appIcon appSquare="12" [icon]="iconName()"></i>
  </div>

  @if (arrayItems().length) {
    <ul class="dashboard__list">
      @for (project of arrayItems(); track project.id) {
        <li>
          @if (appereance() === "my") {
            <ng-container *ngTemplateOutlet="projectCard"></ng-container>
          } @else {
            <a [routerLink]="AppRoutes.projects.detail(project.id)">
              <ng-container *ngTemplateOutlet="projectCard"></ng-container>
            </a>
          }
          <ng-template #projectCard>
            <app-info-card
              [isSubscribed]="profileProjSubsIds()?.includes(project.id)"
              [appereance]="appereance()"
              [showSubscriptionAction]="appereance() !== 'my'"
              [profileId]="project.id"
              [loggedUserId]="loggedUserId()"
              [info]="project"
            ></app-info-card>
          </ng-template>
        </li>
      }
    </ul>
  } @else {
    <div>
      <app-info-card
        (onCreate)="addProjectClick.emit()"
        [section]="
          sectionName() === 'my'
            ? 'projects'
            : sectionName() === 'subscriptions'
              ? 'subscriptions'
              : 'other'
        "
        appereance="empty"
      ></app-info-card>
    </div>
  }

  <a
    class="dashboard__link"
    [routerLink]="
      sectionName() === 'my'
        ? AppRoutes.projects.my()
        : sectionName() === 'subscriptions'
          ? AppRoutes.projects.subscriptions()
          : AppRoutes.projects.all()
    "
  >
    <span style="color: var(--grey-for-text) !important" class="text-body-10">показать раздел</span>
    <i appIcon icon="plus" appSquare="8"></i>
  </a>
</div>
