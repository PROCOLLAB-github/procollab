<!-- @format -->

@if (project()) {
  <main class="project">
    <section class="project__main">
      <div class="project__details">
        @if (desktopLayout()) {
          <app-projects-left-side [project]="project()"></app-projects-left-side>
          <app-projects-mid-side [project]="project()"></app-projects-mid-side>
          <app-projects-right-side [project]="project()"></app-projects-right-side>
        } @else {
          <app-projects-mid-side [project]="project()">
            <div class="project__context">
              <app-projects-left-side [project]="project()"></app-projects-left-side>
              <app-projects-right-side [project]="project()"></app-projects-right-side>
            </div>
          </app-projects-mid-side>
        }
      </div>
    </section>

    <router-outlet></router-outlet>
  </main>
}
