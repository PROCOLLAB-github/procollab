<!-- @format -->
<app-modal [open]="open()" bodyClass="member-filters-dialog-body" (openChange)="close()">
  <section
    class="member-filters-dialog"
    role="dialog"
    aria-modal="true"
    aria-label="Фильтры участников"
    [cdkTrapFocus]="attached()"
    [cdkTrapFocusAutoCapture]="false"
  >
    <header class="member-filters-dialog__header">
      <app-dialog-header title="Фильтры участников" [closable]="false" />
      <button
        appButton="icon"
        #closeButton
        type="button"
        aria-label="Закрыть фильтры"
        (click)="close()"
      >
        ×
      </button>
    </header>
    <div class="member-filters-dialog__content" appDialogBody>
      <app-members-filters [filterForm]="filterForm()" (resetRequested)="resetRequested.emit()" />
    </div>
    <button appButton="primary" type="button" class="member-filters-dialog__done" (click)="close()">
      Готово
    </button>
  </section>
</app-modal>
