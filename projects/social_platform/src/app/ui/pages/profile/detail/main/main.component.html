<!-- @format -->

@if (user()) {
  <section class="profile">
    <div class="profile__details">
      @if (desktopLayout()) {
        <app-profile-left-side [user]="user()"></app-profile-left-side>
        <app-profile-mid-side [user]="user()"></app-profile-mid-side>
        <app-profile-right-side [user]="user()"></app-profile-right-side>
      } @else {
        <app-profile-mid-side [user]="user()">
          <div class="profile__context">
            <app-profile-left-side [user]="user()"></app-profile-left-side>
            <app-profile-right-side [user]="user()"></app-profile-right-side>
          </div>
        </app-profile-mid-side>
      }
    </div>
  </section>
}
