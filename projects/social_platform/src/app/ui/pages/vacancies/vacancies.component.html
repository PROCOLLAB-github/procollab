<!-- vacancies.component.html -->
<!-- @format -->

<main class="page" [attr.aria-label]="isAll() === 'all' ? 'Вакансии' : 'Мои отклики'">
  <div class="page__bar">
    <app-page-header
      [title]="isAll() === 'all' ? 'вакансии' : 'мои отклики'"
      [backRoute]="isAll() === 'all' ? AppRoutes.office.feed() : AppRoutes.office.vacancies()"
    />

    <div class="page__info" [class.page__info--my]="isAll() !== 'all'">
      <div class="page__outlet">
        @if (isAll() === "all") {
          <form appFormLayout [formGroup]="searchForm" (submit)="onSearchSubmit()">
            <app-search formControlName="search"></app-search>
          </form>
        }

        <router-outlet></router-outlet>
      </div>

      @if (isAll() === "all") {
        <div class="page__left">
          <app-vacancy-filter
            (searchValueChange)="onSearhValueChanged($event)"
            [searchValue]="this.searchForm.get('search')?.value!"
            class="page__filter"
          ></app-vacancy-filter>
        </div>
      }
    </div>
  </div>
</main>
