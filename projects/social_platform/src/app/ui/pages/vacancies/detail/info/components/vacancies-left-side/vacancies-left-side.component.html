<!-- @format -->

@if (vacancy(); as item) {
  <div class="content">
    <section class="content__section">
      <h2>Описание вакансии</h2>
      @if (item.description?.trim()) {
        <div
          class="content__description"
          [innerHTML]="item.description | parseLinks | parseBreaks"
        ></div>
      } @else {
        <p class="content__empty">Описание пока не добавлено</p>
      }
    </section>
    <section class="content__section">
      <h2>Навыки</h2>
      <app-vacancy-skills [skills]="item.requiredSkills || []" [limit]="8"></app-vacancy-skills>
    </section>
  </div>
}
