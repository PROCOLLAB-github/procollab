<!-- @format -->

<ul class="snackbar">
  @for (snack of snacks; track snack.id) {
    <li
      class="snackbar__item item text-body-12"
      [ngClass]="{
        'item--success': snack.type === 'success',
        'item--error': snack.type === 'error',
        'item--info': snack.type === 'info',
      }"
      @slideInOut
    >
      <span>{{ snack.text }}</span>
      @if (snack.dismissible) {
        <button
          type="button"
          class="item__close"
          aria-label="Закрыть уведомление"
          (click)="onClose(snack)"
        >
          <i appIcon icon="cross" appSquare="16" aria-hidden="true"></i>
        </button>
      } @else {
        <i
          appIcon
          [icon]="snack.type === 'success' ? 'check' : snack.type === 'info' ? '' : 'error'"
          appSquare="12"
        ></i>
      }
    </li>
  }
</ul>
