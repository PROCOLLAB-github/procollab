<!-- @format -->

<article class="card">
  <div class="card__meta">
    <span class="card__type">Новый проект</span>
    @if (publishedAt()) {
      <time class="card__date" [attr.datetime]="publishedAt()">
        {{ publishedAt() | dayjs: "format" : "DD.MM.YYYY" }}
      </time>
    }
  </div>

  <div class="card__heading">
    <app-avatar [size]="64" [url]="feedItem().imageAddress"></app-avatar>
    <h3 class="card__title">{{ feedItem().name }}</h3>
  </div>

  @if (feedItem().shortDescription) {
    <p class="card__description">{{ feedItem().shortDescription }}</p>
  }

  @if (industryRepository.getOne(feedItem().industry); as industry) {
    <span class="card__industry">{{ industry.name }}</span>
  }

  <app-button
    class="card__cta"
    appearance="outline"
    color="white"
    size="medium"
    customTypographyClass="text-body-12"
    [routerLink]="AppRoutes.projects.detail(feedItem().id)"
  >
    Перейти в проект
  </app-button>
</article>
