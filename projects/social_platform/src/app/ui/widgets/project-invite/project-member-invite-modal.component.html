<!-- @format -->
<app-member-invite-form
  [query]="query"
  [role]="ui.inviteForm.controls.role"
  [state]="search.state()"
  [selected]="ui.selectedRecipient()"
  [unavailableReason]="candidateReason"
  [busy]="isLoading(ui.inviteFormIsSubmitting())"
  [valid]="ui.inviteForm.valid"
  [error]="ui.inviteSubmitError()?.message || ''"
  [trigger]="trigger()"
  (chosen)="select($event)"
  (cleared)="clear()"
  (closed)="closed.emit()"
  (submitted)="team.submitInvite(projectId(), project(), programLinkId())"
/>
