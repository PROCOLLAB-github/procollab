<!-- @format -->

<div
  class="avatar"
  [class.avatar--framed]="!!imageFraming()"
  [class.avatar--border]="hasBorder()"
  [style.width]="size() + 'px'"
  [style.height]="size() + 'px'"
>
  <div [class.avatar--border]="hasBorder()">
    @if (progress()) {
      <div
        class="avatar__progress"
        [style.--progress]="progress()! + '%'"
        [style.--progress-width]="'-12px'"
        [style.--progress-color]="'var(--accent)'"
      ></div>
    }

    @if (imageFraming()) {
      <div
        class="avatar__crop"
        [class.avatar__crop--border]="hasBorder()"
        [style.width.px]="size()"
        [style.height.px]="size()"
        [style.border-color]="'var(--' + borderColor() + ')'"
      >
        <img
          class="avatar__framed-image"
          [src]="url() || placeholderUrl"
          [appImageFraming]="imageFraming()"
          alt="avatar"
        />
      </div>
    } @else {
      <img
        [src]="url() || placeholderUrl"
        [style.width]="size() + 'px'"
        [style.height]="size() + 'px'"
        [style.border-color]="'var(--' + borderColor() + ')'"
        alt="avatar"
      />
    }

    @if (isOnline()) {
      <div
        [style.width]="onlineBadgeSize() + 'px'"
        [style.height]="onlineBadgeSize() + 'px'"
        [style.border-width]="onlineBadgeBorder() + 'px'"
        [style.right]="onlineBadgeOffset() + 'px'"
        [style.bottom]="onlineBadgeOffset() + 'px'"
        class="avatar__online"
      ></div>
    }
  </div>
</div>
