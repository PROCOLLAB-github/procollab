<!-- @format -->

<button
  [type]="type() === 'icon' ? 'button' : type()"
  [class]="
    'button button--' +
    size() +
    ' button--' +
    effectiveColor() +
    ' button--' +
    effectiveAppearance() +
    ' ' +
    (customTypographyClass() || '')
  "
  [class.button--no-border]="!hasBorder()"
  [style.background-color]="backgroundColor()"
  [disabled]="disabled() || loader()"
  [attr.aria-busy]="loader() || null"
>
  <span class="button__content" [class.button__content--loading]="loader()"><ng-content /></span>
  @if (loader()) {
    <span class="button__loader" aria-hidden="true"
      ><app-loader [color]="effectiveAppearance() === 'inline' ? 'white' : 'accent'"
    /></span>
  }
</button>
