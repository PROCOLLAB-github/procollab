<!-- @format -->
<button
  [type]="type() === 'icon' ? 'button' : type()"
  [class]="'button text-body-12' + ' ' + customTypographyClass()"
  [ngClass]="{
    'button--red': color() === 'red',
    'button--inline': appearance() === 'inline',
    'button--outline': appearance() === 'outline',
    'button--no-border': hasBorder() === false,
    'button--green': color() === 'green',
    'button--grey': color() === 'grey',
    'button--gold': color() === 'gold',
    'button--gradient': color() === 'gradient',
    'button--white': color() === 'white',
    'button--small': size() === 'small',
    'button--extra-small': size() === 'extra-small',
    'button--medium': size() === 'medium',
    'button--big': size() === 'big',
    'button--small--icon': size() === 'small' && type() === 'icon',
    'button--medium--icon': size() === 'medium' && type() === 'icon',
    'button--big--icon': size() === 'big' && type() === 'icon',
  }"
  [style.background-color]="backgroundColor()"
  [disabled]="disabled() || (!releaseDesktop() && loader())"
  [attr.aria-busy]="loader() || null"
>
  <span
    class="button__label"
    [style.display]="releaseDesktop() ? (loader() ? 'none' : 'contents') : null"
    [style.visibility]="!releaseDesktop() && loader() ? 'hidden' : null"
  >
    <ng-content></ng-content>
  </span>
  @if (loader()) {
    <span class="button__loader" [style.display]="releaseDesktop() ? 'contents' : null">
      <app-loader [color]="appearance() === 'inline' ? 'white' : 'gray'"></app-loader>
    </span>
  }
</button>
