<!-- @format -->
<!-- Desktop сохраняет production-разметку; адаптив ниже 1000px. -->
@if (releaseDesktop()) {
  <div class="back text-heading-1" (click)="onClick()">
    <i class="back__icon" appIcon icon="left-arrow" appSquare="24"></i>
    <span>{{ namespace() }}</span>
  </div>
} @else {
  <button
    [appButton]="compact() ? 'icon' : 'text'"
    type="button"
    class="back text-heading-1"
    [class.back--compact]="compact()"
    [attr.aria-label]="namespace() || 'Назад'"
    (click)="onClick()"
  >
    <i class="back__icon" appIcon icon="left-arrow" appSquare="24" aria-hidden="true"></i
    ><span>{{ namespace() }}</span>
  </button>
}
